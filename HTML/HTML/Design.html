<html>
    <head>
        <title>Design</title>
    </head>
    <body>
        <h1>
            This is a Design practice in html.
        </h1>
        <p style="color: red;">Hello World</p>
        <p style="color: red;"><u>Hello World</u></p>

        <p style="color: red;"><b>Hello World</b></p>
        <p style="color: red;"><strong>Hello World</strong></p>

        <p style="color: red;"><i>Hello World</i></p>

        <p style="color: red;">A<sup>2</sup>+B<sup>2</sup></p>

        <p style="color: red;"><del>Hello World</del></p>
        <p style="color: red;"><s>Hello World</s></p>

        <span><p style="color: red;background-color: yellow;">Hello World</p></span>
    </body>
</html>
